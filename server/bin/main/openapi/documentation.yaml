openapi: 3.0.3
info:
  title: Namma Ooru Bus API
  version: 1.0.0
  description: >-
    API for bus timetables and departure-location lookups. The shared X-API-Key
    protects API requests but does not identify an administrator or grant an
    admin role. Bus mutation endpoints are not admin-role authorized yet.
servers:
  - url: http://localhost:8080
    description: Local development server
security:
  - ApiKeyAuth: []
paths:
  /api/v1/buses:
    get:
      summary: List buses
      description: Filter by departure location, English destination, and departure time range.
      parameters:
        - name: departureLocation
          in: query
          required: false
          schema:
            type: string
          example: Viriyur
        - name: destination
          in: query
          required: false
          description: English destination name.
          schema:
            type: string
          example: Sankarapuram
        - name: departureTimeFrom
          in: query
          required: false
          description: Inclusive lower time bound. Supply together with departureTimeTo.
          schema:
            type: string
            pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$'
          example: "05:00"
        - name: departureTimeTo
          in: query
          required: false
          description: Inclusive upper time bound. Supply together with departureTimeFrom.
          schema:
            type: string
            pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$'
          example: "12:00"
      responses:
        "200":
          description: Buses matching all supplied filters, ordered by departure time.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Create a bus
      description: Requires the shared API key. The current API does not verify an admin role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusInput"
      responses:
        "201":
          description: Bus created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/buses/{busId}:
    parameters:
      - name: busId
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get a bus
      responses:
        "200":
          description: Bus found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      summary: Replace a bus
      description: Requires the shared API key. The current API does not verify an admin role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusInput"
      responses:
        "200":
          description: Bus updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Delete a bus
      description: Requires the shared API key. The current API does not verify an admin role.
      responses:
        "200":
          description: Bus deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/departure-locations:
    get:
      summary: List departure locations
      responses:
        "200":
          description: Departure locations read from the database.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StringListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/departure-locations/{departureLocation}/destinations:
    get:
      summary: List destinations for a departure location
      parameters:
        - name: departureLocation
          in: path
          required: true
          schema:
            type: string
          example: Viriyur
      responses:
        "200":
          description: English destinations available from this location.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StringListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /openapi/documentation.yaml:
    get:
      summary: Download this OpenAPI document
      security: []
      responses:
        "200":
          description: OpenAPI document.
          content:
            application/yaml:
              schema:
                type: string
  /swagger:
    get:
      summary: Swagger UI
      security: []
      responses:
        "200":
          description: Interactive API documentation.
          content:
            text/html:
              schema:
                type: string
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Shared API key; this does not prove that the caller is an administrator.
  schemas:
    BusInput:
      type: object
      required:
        - departingFrom
        - destinationEnglish
        - destinationTamil
        - busName
        - note
        - departTime
        - days
      properties:
        id:
          type: string
          description: Optional on creation; generated by the server when omitted.
        departingFrom:
          type: string
        destinationEnglish:
          type: string
        destinationTamil:
          type: string
        busName:
          type: string
        note:
          type: string
        departTime:
          type: string
          description: Bus departure time, for example 05:45 AM.
          example: 05:45 AM
        days:
          type: array
          items:
            $ref: "#/components/schemas/Day"
    Bus:
      allOf:
        - $ref: "#/components/schemas/BusInput"
        - type: object
          required:
            - id
          properties:
            id:
              type: string
    Day:
      type: string
      enum:
        - Monday
        - Tuesday
        - Wednesday
        - Thursday
        - Friday
        - Saturday
        - Sunday
    ApiResponse:
      type: object
      required:
        - result
        - message
        - data
      properties:
        result:
          type: string
          enum:
            - success
            - failed
        message:
          type: string
        data:
          nullable: true
    BusResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/Bus"
    BusListResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/Bus"
    StringListResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              type: array
              items:
                type: string
    EmptyResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              nullable: true
  responses:
    BadRequest:
      description: Invalid request data or query parameters.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiResponse"
    Unauthorized:
      description: Missing or invalid shared API key.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiResponse"
    NotFound:
      description: Bus not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiResponse"